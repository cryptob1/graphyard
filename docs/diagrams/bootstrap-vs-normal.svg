<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1967" width="560" height="1967" role="img" aria-labelledby="title desc" font-family='Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", ui-sans-serif, system-ui, -apple-system, sans-serif'>
<title id="title">Bootstrap single-agent operation versus normal multi-agent operation</title>
<desc id="desc">Phase 1, bootstrap: the human operator, holding the admin credential, directly supervises one worker session that holds a worker credential, one lease epoch, and one assigned worktree. The worker sends claim, heartbeat, and submit commands to the Graphyard control plane, whose merge writer pushes gate-passing heads to the git remote. No AI master, loop program, slice leads or reviewer sessions exist yet, but every gate is enforced. Phase 2, normal operation: the human operator supplies goals and the human-only decisions. The AI master reasons and decides under its operator-agent identity. A separate loop program observes ready work and gates and carries out routine actions; independent reviewers and proof producers judge results. The loop dispatches to many worker sessions, each with its own credential, lease epoch, and worktree; workers submit exact commits to Graphyard and push nothing; the merge writer alone pushes the base branch. The gates and credential boundaries are the same in both phases.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb39c"/></marker></defs>
<rect width="560" height="1967" fill="#111714"/>
<text x="20" y="36.2" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">Phase 1 · Bootstrap: one worker under direct</text>
<text x="20" y="60.0" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">supervision</text>
<rect x="20" y="71.52000000000001" width="520" height="138.6" rx="14" fill="#3a3020" stroke="#e0c27a" stroke-width="2"/>
<text x="32" y="101.5" font-size="16" font-weight="650" fill="#f6e7b8" text-anchor="start">Human operator</text>
<text x="32" y="120.3" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">Connects the repository and registers the merge writer’s deploy</text>
<text x="32" y="138.8" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">key, creates the work item, and supervises the one worker</text>
<text x="32" y="157.3" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">session directly. Holds the admin credential.</text>
<rect x="32" y="174.08" width="55.0" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="191.7" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">admin</text>
<rect x="95" y="174.08" width="156.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="103" y="191.7" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sessionKind: human</text>
<line x1="280" y1="210.08" x2="280" y2="254.08" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="290" y="229.5" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">supervises directly; creates,</text>
<text x="290" y="246.7" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">releases, reviews</text>
<rect x="20" y="256.08000000000004" width="520" height="138.6" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="32" y="286.0" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">One worker session</text>
<text x="32" y="304.9" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Claims one item, works in one assigned worktree under watch,</text>
<text x="32" y="323.4" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">commits and submits the exact head; pushes nothing. It never</text>
<text x="32" y="341.9" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">receives the operator credential or the deploy key.</text>
<rect x="32" y="358.64000000000004" width="62.8" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="376.2" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worker</text>
<rect x="102.8" y="358.64000000000004" width="117.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="110.8" y="376.2" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lease · epoch</text>
<rect x="228.2" y="358.64000000000004" width="78.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="236.2" y="376.2" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worktree</text>
<line x1="280" y1="394.64000000000004" x2="280" y2="438.64000000000004" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="290" y="422.6" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">claim, heartbeat, submit</text>
<rect x="20" y="440.64000000000004" width="236" height="125.7" rx="4" fill="#182a36" stroke="#8fc1e6" stroke-width="2"/>
<text x="32" y="470.6" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">Graphyard control</text>
<text x="32" y="491.7" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">plane</text>
<text x="32" y="510.6" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">Same gates as phase 2:</text>
<text x="32" y="529.1" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">review, trial build,</text>
<text x="32" y="547.5" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">acceptance, merge.</text>
<rect x="324" y="440.64000000000004" width="216" height="86.1" rx="4" fill="#262d28" stroke="#b8c2bb" stroke-width="2"/>
<text x="336" y="470.6" font-size="16" font-weight="650" fill="#e3e9e3" text-anchor="start">Git remote</text>
<text x="336" y="489.5" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">Base branch the merge</text>
<text x="336" y="507.9" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">writer pushes.</text>
<line x1="260" y1="474.64000000000004" x2="320" y2="474.64000000000004" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="20" y="592.9" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">No AI master, loop program, slice leads or reviewer sessions yet: the</text>
<text x="20" y="610.1" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">human operator performs those duties. Every gate is already enforced.</text>
<text x="20" y="662.8" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">Phase 2 · Normal operation: many sessions,</text>
<text x="20" y="686.6" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">same gates</text>
<rect x="20" y="698.1600000000001" width="520" height="120.1" rx="14" fill="#3a3020" stroke="#e0c27a" stroke-width="2"/>
<text x="32" y="728.1" font-size="16" font-weight="650" fill="#f6e7b8" text-anchor="start">Human operator</text>
<text x="32" y="747.0" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">Keeps goals and priorities, money and accounts, and credentials</text>
<text x="32" y="765.5" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">for people.</text>
<rect x="32" y="782.2400000000001" width="55.0" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="799.8" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">admin</text>
<rect x="95" y="782.2400000000001" width="156.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="103" y="799.8" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sessionKind: human</text>
<line x1="120" y1="818.2400000000001" x2="120" y2="862.2400000000001" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="130" y="846.2" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">goals</text>
<line x1="440" y1="818.2400000000001" x2="440" y2="862.2400000000001" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="430" y="846.2" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">human-only decisions</text>
<rect x="20" y="864.2400000000001" width="236" height="175.5" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="32" y="894.2" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Master operator agent</text>
<text x="32" y="913.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">One identity the master</text>
<text x="32" y="931.5" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">uses: applies release,</text>
<text x="32" y="950.0" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">unblock, requirements,</text>
<text x="32" y="968.5" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">rework, close and attest at</text>
<text x="32" y="987.0" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">once.</text>
<rect x="32" y="1003.7600000000001" width="125.2" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="1021.3" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">operator-agent</text>
<rect x="304" y="864.2400000000001" width="236" height="125.7" rx="4" fill="#182a36" stroke="#8fc1e6" stroke-width="2"/>
<text x="316" y="894.2" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">Graphyard control</text>
<text x="316" y="915.3" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">plane</text>
<text x="316" y="934.2" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">Ownership, candidates,</text>
<text x="316" y="952.7" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">evidence, gates. Unchanged</text>
<text x="316" y="971.1" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">from phase 1.</text>
<line x1="260" y1="898.2400000000001" x2="300" y2="898.2400000000001" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="1089.7600000000002" width="165" height="175.5" rx="4" fill="#182a36" stroke="#8fc1e6" stroke-width="2"/>
<text x="32" y="1119.7" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">Loop program</text>
<text x="32" y="1138.6" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">Repeats</text>
<text x="32" y="1157.1" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">observations and</text>
<text x="32" y="1175.5" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">routine actions;</text>
<text x="32" y="1194.0" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">launches the AI</text>
<text x="32" y="1212.5" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">master.</text>
<rect x="32" y="1229.2800000000002" width="101.8" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="1246.9" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">coordinator</text>
<rect x="197" y="1089.7600000000002" width="165" height="138.6" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="209" y="1119.7" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Slice leads</text>
<text x="209" y="1138.6" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Optional. One per</text>
<text x="209" y="1157.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">slice; rulings</text>
<text x="209" y="1175.5" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">cite a rule ID.</text>
<rect x="209" y="1192.3200000000002" width="94.0" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="217" y="1209.9" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">slice-lead</text>
<rect x="374" y="1089.7600000000002" width="166" height="162.3" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="386" y="1119.7" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Reviewer /</text>
<text x="386" y="1140.8" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">proof</text>
<text x="386" y="1162.0" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">producers</text>
<text x="386" y="1180.8" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Independent of</text>
<text x="386" y="1199.3" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">every implementer.</text>
<rect x="386" y="1216.0800000000002" width="78.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="394" y="1233.7" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">producer</text>
<line x1="422" y1="991.9200000000001" x2="422" y2="1085.7600000000002" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="412" y="1044.8" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">ready work, gate state</text>
<rect x="20" y="1309.2800000000002" width="520" height="138.6" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="32" y="1339.2" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Worker sessions (n)</text>
<text x="32" y="1358.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Each holds its own worker credential, one lease epoch per</text>
<text x="32" y="1376.6" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">claimed item, and one assigned worktree per assignment. Still</text>
<text x="32" y="1395.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">untrusted: no operator, coordinator, or producer credential.</text>
<rect x="32" y="1411.8400000000001" width="62.8" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="1429.4" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worker</text>
<rect x="102.8" y="1411.8400000000001" width="117.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="110.8" y="1429.4" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lease · epoch</text>
<rect x="228.2" y="1411.8400000000001" width="78.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="236.2" y="1429.4" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worktree</text>
<line x1="102.5" y1="1267.2800000000002" x2="102.5" y2="1305.2800000000002" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="112.5" y="1283.7" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">dispatch (invitation, not</text>
<text x="112.5" y="1300.9" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">ownership)</text>
<rect x="20" y="1493.8400000000001" width="520" height="86.1" rx="4" fill="#262d28" stroke="#b8c2bb" stroke-width="2"/>
<text x="32" y="1523.8" font-size="16" font-weight="650" fill="#e3e9e3" text-anchor="start">Git remote (e.g. GitHub)</text>
<text x="32" y="1542.7" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">Base branch only. The merge writer pushes a trial-merged,</text>
<text x="32" y="1561.1" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">gate-passing head with its deploy key; workers push nothing.</text>
<text x="20" y="1606.5" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">Herdr hosts the master, lead, worker, and reviewer sessions and reports</text>
<text x="20" y="1623.7" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">their health. Graphyard enforces separation only through principals and</text>
<text x="20" y="1640.8" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">credentials; keeping the sessions independent is the runtime’s job.</text>
<text x="20" y="1679.6" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">Legend (glossary terms)</text>
<g transform="translate(0 1691.2)"><rect x="20" y="0" width="34" height="22" rx="9" fill="#3a3020" stroke="#e0c27a" stroke-width="2"/></g>
<text x="66" y="1705.9" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Human operator (human authority)</text>
<g transform="translate(0 1721.2)"><rect x="20" y="0" width="34" height="22" rx="9" fill="#22311f" stroke="#c5e69b" stroke-width="2"/></g>
<text x="66" y="1735.9" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">AI agent session (one role, one credential)</text>
<g transform="translate(0 1751.2)"><rect x="20" y="0" width="34" height="22" rx="3" fill="#182a36" stroke="#8fc1e6" stroke-width="2"/></g>
<text x="66" y="1765.9" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Graphyard control plane</text>
<g transform="translate(0 1781.2)"><rect x="20" y="0" width="34" height="22" rx="9" fill="#2a2338" stroke="#c3b1ec" stroke-width="2"/></g>
<text x="66" y="1795.9" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Herdr runtime (session supervision)</text>
<g transform="translate(0 1811.2)"><rect x="20" y="0" width="34" height="22" rx="3" fill="#262d28" stroke="#b8c2bb" stroke-width="2"/></g>
<text x="66" y="1825.9" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Git remote and other external facts</text>
<g transform="translate(0 1841.2)"><rect x="20" y="0" width="34" height="22" rx="11" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/></g>
<text x="66" y="1855.9" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Chip: credential, lease epoch, or assigned worktree the</text>
<text x="66" y="1874.3" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">session holds</text>
<g transform="translate(0 1886.1)"><line x1="20" y1="11" x2="54" y2="11" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<text x="66" y="1900.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Solid arrow: an authenticated command or authority</text>
<g transform="translate(0 1916.1)"><line x1="20" y1="11" x2="54" y2="11" stroke="#9fb39c" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/></g>
<text x="66" y="1930.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Dashed arrow: observation or health report, never authority</text>
</svg>
