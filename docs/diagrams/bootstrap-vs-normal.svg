<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1971" width="560" height="1971" role="img" aria-labelledby="title desc" font-family='Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", ui-sans-serif, system-ui, -apple-system, sans-serif'>
<title id="title">Bootstrap single-agent operation versus normal multi-agent operation</title>
<desc id="desc">Phase 1, bootstrap: the human operator, holding the admin credential, directly supervises one worker session that holds a worker credential, one lease epoch, and one assigned worktree. The worker sends claim, heartbeat, and submit commands to the Graphyard control plane, whose merge writer pushes gate-passing heads to the git remote. No operator agent, master loop, slice leads, or reviewer session exist yet, but every gate is enforced. Phase 2, normal operation: the human operator supplies goals and the human-only decisions. An optional scoped operator agent turns goals into bounded intent. The master loop, optional slice leads, and independent reviewer and proof producer sessions read ready work and gate state from Graphyard. The master dispatches to many worker sessions, each with its own credential, lease epoch, and worktree; workers submit exact commits to Graphyard and push nothing; the merge writer alone pushes the base branch. The gates and credential boundaries are the same in both phases.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb39c"/></marker></defs>
<rect width="560" height="1971" fill="#111714"/>
<text x="20" y="36.2" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">Phase 1 · Bootstrap: one worker under direct</text>
<text x="20" y="60.0" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">supervision</text>
<rect x="20" y="71.52000000000001" width="520" height="138.6" rx="14" fill="#3a3020" stroke="#e0c27a" stroke-width="2"/>
<text x="32" y="101.5" font-size="16" font-weight="650" fill="#f6e7b8" text-anchor="start">Human operator</text>
<text x="32" y="120.3" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">Connects the repository and registers the merge writer’s deploy</text>
<text x="32" y="138.8" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">key, creates the work item, and supervises the one worker</text>
<text x="32" y="157.3" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">session directly. Holds the admin credential.</text>
<rect x="32" y="174.08" width="55.0" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="191.7" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">admin</text>
<rect x="95" y="174.08" width="156.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="103" y="191.7" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sessionKind: human</text>
<line x1="280" y1="210.08" x2="280" y2="254.08" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="290" y="229.5" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">supervises directly; creates,</text>
<text x="290" y="246.7" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">releases, reviews</text>
<rect x="20" y="256.08000000000004" width="520" height="138.6" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="32" y="286.0" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">One worker session</text>
<text x="32" y="304.9" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Claims one item, works in one assigned worktree under watch,</text>
<text x="32" y="323.4" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">commits and submits the exact head; pushes nothing. It never</text>
<text x="32" y="341.9" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">receives the operator credential or the deploy key.</text>
<rect x="32" y="358.64000000000004" width="62.8" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="376.2" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worker</text>
<rect x="102.8" y="358.64000000000004" width="117.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="110.8" y="376.2" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lease · epoch</text>
<rect x="228.2" y="358.64000000000004" width="78.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="236.2" y="376.2" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worktree</text>
<line x1="280" y1="394.64000000000004" x2="280" y2="438.64000000000004" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="290" y="422.6" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">claim, heartbeat, submit</text>
<rect x="20" y="440.64000000000004" width="236" height="125.7" rx="4" fill="#182a36" stroke="#8fc1e6" stroke-width="2"/>
<text x="32" y="470.6" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">Graphyard control</text>
<text x="32" y="491.7" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">plane</text>
<text x="32" y="510.6" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">Same gates as phase 2:</text>
<text x="32" y="529.1" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">review, trial build,</text>
<text x="32" y="547.5" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">acceptance, merge.</text>
<rect x="324" y="440.64000000000004" width="216" height="86.1" rx="4" fill="#262d28" stroke="#b8c2bb" stroke-width="2"/>
<text x="336" y="470.6" font-size="16" font-weight="650" fill="#e3e9e3" text-anchor="start">Git remote</text>
<text x="336" y="489.5" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">Base branch the merge</text>
<text x="336" y="507.9" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">writer pushes.</text>
<line x1="260" y1="474.64000000000004" x2="320" y2="474.64000000000004" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="20" y="592.9" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">No operator agent, no master loop, no slice leads, no reviewer session</text>
<text x="20" y="610.1" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">yet: the human operator performs those duties. Every gate is already</text>
<text x="20" y="627.2" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">enforced.</text>
<text x="20" y="680.0" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">Phase 2 · Normal operation: many sessions,</text>
<text x="20" y="703.8" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">same gates</text>
<rect x="20" y="715.32" width="520" height="120.1" rx="14" fill="#3a3020" stroke="#e0c27a" stroke-width="2"/>
<text x="32" y="745.3" font-size="16" font-weight="650" fill="#f6e7b8" text-anchor="start">Human operator</text>
<text x="32" y="764.1" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">Keeps goals and priorities, money and accounts, and credentials</text>
<text x="32" y="782.6" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">for people.</text>
<rect x="32" y="799.4000000000001" width="55.0" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="817.0" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">admin</text>
<rect x="95" y="799.4000000000001" width="156.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="103" y="817.0" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sessionKind: human</text>
<line x1="120" y1="835.4000000000001" x2="120" y2="879.4000000000001" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="130" y="863.4" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">goals</text>
<line x1="440" y1="835.4000000000001" x2="440" y2="879.4000000000001" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="430" y="863.4" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">human-only decisions</text>
<rect x="20" y="881.4000000000001" width="236" height="175.5" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="32" y="911.4" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Master operator agent</text>
<text x="32" y="930.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">One identity the master</text>
<text x="32" y="948.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">uses: applies release,</text>
<text x="32" y="967.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">unblock, requirements,</text>
<text x="32" y="985.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">rework, close and attest at</text>
<text x="32" y="1004.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">once.</text>
<rect x="32" y="1020.9200000000001" width="125.2" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="1038.5" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">operator-agent</text>
<rect x="304" y="881.4000000000001" width="236" height="125.7" rx="4" fill="#182a36" stroke="#8fc1e6" stroke-width="2"/>
<text x="316" y="911.4" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">Graphyard control</text>
<text x="316" y="932.5" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">plane</text>
<text x="316" y="951.3" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">Ownership, candidates,</text>
<text x="316" y="969.8" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">evidence, gates. Unchanged</text>
<text x="316" y="988.3" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">from phase 1.</text>
<line x1="260" y1="915.4000000000001" x2="300" y2="915.4000000000001" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="1106.92" width="165" height="138.6" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="32" y="1136.9" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Master loop</text>
<text x="32" y="1155.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Dispatches,</text>
<text x="32" y="1174.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">shepherds,</text>
<text x="32" y="1192.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">records merges.</text>
<rect x="32" y="1209.48" width="101.8" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="1227.1" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">coordinator</text>
<rect x="197" y="1106.92" width="165" height="138.6" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="209" y="1136.9" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Slice leads</text>
<text x="209" y="1155.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Optional. One per</text>
<text x="209" y="1174.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">slice; rulings</text>
<text x="209" y="1192.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">cite a rule ID.</text>
<rect x="209" y="1209.48" width="94.0" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="217" y="1227.1" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">slice-lead</text>
<rect x="374" y="1106.92" width="166" height="162.3" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="386" y="1136.9" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Reviewer /</text>
<text x="386" y="1158.0" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">proof</text>
<text x="386" y="1179.1" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">producers</text>
<text x="386" y="1198.0" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Independent of</text>
<text x="386" y="1216.5" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">every implementer.</text>
<rect x="386" y="1233.24" width="78.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="394" y="1250.8" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">producer</text>
<line x1="422" y1="1009.0800000000002" x2="422" y2="1102.92" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="412" y="1062.0" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">ready work, gate state</text>
<rect x="20" y="1313.24" width="520" height="138.6" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="32" y="1343.2" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Worker sessions (n)</text>
<text x="32" y="1362.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Each holds its own worker credential, one lease epoch per</text>
<text x="32" y="1380.5" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">claimed item, and one assigned worktree per assignment. Still</text>
<text x="32" y="1399.0" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">untrusted: no operator, coordinator, or producer credential.</text>
<rect x="32" y="1415.8" width="62.8" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="1433.4" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worker</text>
<rect x="102.8" y="1415.8" width="117.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="110.8" y="1433.4" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lease · epoch</text>
<rect x="228.2" y="1415.8" width="78.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="236.2" y="1433.4" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worktree</text>
<line x1="102.5" y1="1247.48" x2="102.5" y2="1309.24" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="112.5" y="1275.8" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">dispatch (invitation, not</text>
<text x="112.5" y="1292.9" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">ownership)</text>
<rect x="20" y="1497.8" width="520" height="86.1" rx="4" fill="#262d28" stroke="#b8c2bb" stroke-width="2"/>
<text x="32" y="1527.8" font-size="16" font-weight="650" fill="#e3e9e3" text-anchor="start">Git remote (e.g. GitHub)</text>
<text x="32" y="1546.6" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">Base branch only. The merge writer pushes a trial-merged,</text>
<text x="32" y="1565.1" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">gate-passing head with its deploy key; workers push nothing.</text>
<text x="20" y="1610.5" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">Herdr hosts the master, lead, worker, and reviewer sessions and reports</text>
<text x="20" y="1627.6" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">their health. Graphyard enforces separation only through principals and</text>
<text x="20" y="1644.8" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">credentials; keeping the sessions independent is the runtime’s job.</text>
<text x="20" y="1683.6" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">Legend (glossary terms)</text>
<g transform="translate(0 1695.1)"><rect x="20" y="0" width="34" height="22" rx="9" fill="#3a3020" stroke="#e0c27a" stroke-width="2"/></g>
<text x="66" y="1709.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Human operator (human authority)</text>
<g transform="translate(0 1725.1)"><rect x="20" y="0" width="34" height="22" rx="9" fill="#22311f" stroke="#c5e69b" stroke-width="2"/></g>
<text x="66" y="1739.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">AI agent session (one role, one credential)</text>
<g transform="translate(0 1755.1)"><rect x="20" y="0" width="34" height="22" rx="3" fill="#182a36" stroke="#8fc1e6" stroke-width="2"/></g>
<text x="66" y="1769.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Graphyard control plane</text>
<g transform="translate(0 1785.1)"><rect x="20" y="0" width="34" height="22" rx="9" fill="#2a2338" stroke="#c3b1ec" stroke-width="2"/></g>
<text x="66" y="1799.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Herdr runtime (session supervision)</text>
<g transform="translate(0 1815.1)"><rect x="20" y="0" width="34" height="22" rx="3" fill="#262d28" stroke="#b8c2bb" stroke-width="2"/></g>
<text x="66" y="1829.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Git remote and other external facts</text>
<g transform="translate(0 1845.1)"><rect x="20" y="0" width="34" height="22" rx="11" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/></g>
<text x="66" y="1859.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Chip: credential, lease epoch, or assigned worktree the</text>
<text x="66" y="1878.3" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">session holds</text>
<g transform="translate(0 1890.1)"><line x1="20" y1="11" x2="54" y2="11" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<text x="66" y="1904.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Solid arrow: an authenticated command or authority</text>
<g transform="translate(0 1920.1)"><line x1="20" y1="11" x2="54" y2="11" stroke="#9fb39c" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/></g>
<text x="66" y="1934.8" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Dashed arrow: observation or health report, never authority</text>
</svg>
