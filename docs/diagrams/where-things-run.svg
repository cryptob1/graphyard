<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Diagram of where every part of Graphyard runs: the host, its systemd units, Docker containers, Herdr, agent worktrees and files, and the outside services">
  <title>Where things run</title>
  <desc>One Linux host runs the loop and deploy watch as systemd user units, the control-plane server and Postgres as Docker containers (server on port 4310), one short-lived container per merge trial, Herdr with the master's pane, and headless agents confined in worktrees. Outside the host: GitHub, agent providers, npm and GHCR published by GitHub Actions, and the operator's browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6672"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #d9dee3; stroke-width: 1.5; }
    .group { fill: none; stroke: #d9dee3; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .host { fill: #ffffff; stroke: #d9dee3; stroke-width: 2; }
    .loop { stroke: #b5480f; stroke-width: 2; }
    .hub { fill: #2f4a63; stroke: #2f4a63; }
    .ext { fill: #efe9fb; stroke: #6a4bb5; stroke-width: 1.5; }
    .t-title { font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #1b2129; }
    .t-sub { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 10.5px; fill: #5b6672; }
    .t-key { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9.5px; fill: #b5480f; }
    .t-label { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.08em; fill: #5b6672; }
    .t-note { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 9px; fill: #5b6672; }
    .t-arrow { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 8.5px; fill: #5b6672; }
    .t-hub { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; fill: #ffffff; }
    .s-hub { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 10.5px; fill: #d9dee3; }
    .k-hub { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9.5px; fill: #ffffff; }
    .v-line { stroke: #5b6672; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="960" height="540" fill="#f5f6f7"/>

  <!-- The host -->
  <rect class="host" x="6" y="30" width="634" height="504" rx="14"/>
  <text class="t-label" x="20" y="52">YOUR HOST · LINUX</text>

  <!-- The loop unit -->
  <rect class="box loop" x="20" y="66" width="286" height="96" rx="10"/>
  <text class="t-title" x="32" y="86">graphyard-master-OWNER-NAME.service</text>
  <text class="t-sub" x="32" y="103">the loop — dispatch · merge writer · batch gate</text>
  <text class="t-key" x="32" y="124">journalctl --user</text>
  <text class="t-key" x="32" y="138">  -u graphyard-master-OWNER-NAME.service</text>

  <!-- The deploy unit -->
  <rect class="box" x="20" y="170" width="286" height="82" rx="10"/>
  <text class="t-title" x="32" y="190">graphyard-deploy-OWNER-NAME.service</text>
  <text class="t-sub" x="32" y="207">the deploy watch — build, restart, health, rollback</text>
  <text class="t-key" x="32" y="228">journalctl --user</text>
  <text class="t-key" x="32" y="242">  -u graphyard-deploy-OWNER-NAME.service</text>

  <!-- Herdr -->
  <rect class="box" x="20" y="266" width="286" height="60" rx="10"/>
  <text class="t-title" x="32" y="288">Herdr</text>
  <text class="t-sub" x="32" y="306">the master's pane and the agent sessions</text>

  <!-- Headless agents -->
  <rect class="box" x="20" y="334" width="286" height="80" rx="10"/>
  <text class="t-title" x="32" y="354">Headless agent runs</text>
  <text class="t-sub" x="32" y="371">workers · reviewers · producers</text>
  <text class="t-sub" x="32" y="387">bubblewrap + Landlock, each in its worktree</text>

  <!-- The files -->
  <rect class="box" x="20" y="422" width="286" height="88" rx="10"/>
  <text class="t-title" x="32" y="442">The files</text>
  <text class="t-sub" x="32" y="460">checkout .graphyard/ — connection, units,</text>
  <text class="t-sub" x="32" y="474">worktrees · ~/.config/graphyard/&lt;install&gt;/</text>
  <text class="t-sub" x="32" y="490">— credentials 0600, CLI releases</text>

  <!-- Docker containers -->
  <rect class="group" x="344" y="66" width="288" height="296" rx="12"/>
  <text class="t-label" x="356" y="86">DOCKER</text>

  <rect class="box hub" x="356" y="96" width="264" height="80" rx="10"/>
  <text class="t-hub" x="368" y="118">graphyard-OWNER-NAME-server-1</text>
  <text class="s-hub" x="368" y="136">control plane + dashboard</text>
  <text class="s-hub" x="368" y="152">127.0.0.1:4310</text>
  <text class="k-hub" x="368" y="170">docker logs graphyard-OWNER-NAME-server-1</text>

  <rect class="box" x="356" y="186" width="264" height="70" rx="10"/>
  <text class="t-title" x="368" y="206">graphyard-OWNER-NAME-db-1</text>
  <text class="t-sub" x="368" y="223">Postgres 17, on the server's own network</text>
  <text class="t-key" x="368" y="244">docker logs graphyard-OWNER-NAME-db-1</text>

  <rect class="box" x="356" y="266" width="264" height="80" rx="10"/>
  <text class="t-title" x="368" y="286">Merge trials</text>
  <text class="t-sub" x="368" y="303">graphyard-trial-… — one short-lived</text>
  <text class="t-sub" x="368" y="318">container per merge trial, plus any</text>
  <text class="t-sub" x="368" y="333">compose services a check declares</text>

  <text class="t-sub" x="356" y="360">The checkout itself — one shared Git</text>
  <text class="t-sub" x="356" y="375">checkout under the units and containers,</text>
  <text class="t-sub" x="356" y="390">with every agent in a worktree of it.</text>

  <text class="t-note" x="20" y="526">OWNER-NAME is the repository's slug in every unit and container name an install owns.</text>

  <!-- Outside -->
  <text class="t-label" x="660" y="52">OUTSIDE</text>

  <rect class="box ext" x="660" y="66" width="294" height="106" rx="10"/>
  <text class="t-title" x="672" y="88">GitHub</text>
  <text class="t-sub" x="672" y="106">every part fetches; only the merge</text>
  <text class="t-sub" x="672" y="121">writer pushes — deploy key or the</text>
  <text class="t-sub" x="672" y="136">operator's gh login</text>

  <rect class="box ext" x="660" y="190" width="294" height="76" rx="10"/>
  <text class="t-title" x="672" y="212">Agent providers</text>
  <text class="t-sub" x="672" y="230">Claude, Codex and the rest —</text>
  <text class="t-sub" x="672" y="245">the accounts' API calls</text>

  <rect class="box ext" x="660" y="284" width="294" height="88" rx="10"/>
  <text class="t-title" x="672" y="306">npm + GHCR</text>
  <text class="t-sub" x="672" y="324">packages published by GitHub</text>
  <text class="t-sub" x="672" y="339">Actions; the host holds no</text>
  <text class="t-sub" x="672" y="354">publish token</text>

  <rect class="box ext" x="660" y="390" width="294" height="76" rx="10"/>
  <text class="t-title" x="672" y="412">Your browser</text>
  <text class="t-sub" x="672" y="430">the dashboard — localhost or the</text>
  <text class="t-sub" x="672" y="445">tailnet, port 4310</text>

  <!-- Arrows -->
  <path class="v-line" d="M 306 106 L 342 106"/>
  <text class="t-arrow" x="324" y="99" text-anchor="middle">its API</text>

  <path class="v-line" d="M 488 176 L 488 184"/>
  <text class="t-arrow" x="496" y="184">SQL</text>

  <path class="v-line" d="M 306 140 L 326 140 L 326 306 L 342 306"/>
  <text class="t-arrow" x="330" y="228" transform="rotate(-90 330 228)" text-anchor="middle">runs the trials</text>

  <path class="v-line" d="M 22 100 L 13 100 L 13 296 L 19 296"/>
  <text class="t-arrow" x="16" y="200" transform="rotate(-90 16 200)" text-anchor="middle">master's pane</text>

  <path class="v-line" d="M 306 84 L 646 84 L 646 112 L 656 112"/>
  <text class="t-arrow" x="420" y="79" text-anchor="middle">fetch · push</text>

  <path class="v-line" d="M 306 374 L 640 374 L 640 228 L 656 228"/>
  <text class="t-arrow" x="470" y="369" text-anchor="middle">API calls</text>

  <path class="v-line" d="M 807 172 L 807 282"/>
  <text class="t-arrow" x="813" y="231">Actions publish</text>

  <path class="v-line" d="M 658 428 L 650 428 L 650 150 L 626 150"/>
  <text class="t-arrow" x="655" y="300" transform="rotate(-90 655 300)" text-anchor="middle">dashboard · :4310</text>
</svg>
