<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1538" width="560" height="1538" role="img" aria-labelledby="title desc" font-family='Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", ui-sans-serif, system-ui, -apple-system, sans-serif'>
<title id="title">Who holds which authority in Graphyard</title>
<desc id="desc">The human operator, holding an admin credential declared human, makes the human-only decisions and sends them to the Graphyard control plane. Below the control plane, the Herdr runtime hosts three agent sessions, each with one credential: the master (coordinator), the slice lead (slice-lead), and the worker (worker credential, lease epoch, and assigned worktree). Beside them are the reviewer (launched by the control plane, posting its verdict to the API), the proof producer (producer credential with a grant), and the optional scoped operator agent. Sessions send authenticated commands to Graphyard; the worker submits its exact commit and pushes nothing; the reviewer posts its verdict on that head to Graphyard. The merge writer trial-merges a head whose gates passed and pushes the base branch to the git remote with its deploy key.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb39c"/></marker></defs>
<rect width="560" height="1538" fill="#111714"/>
<text x="20" y="36.2" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">Who holds which authority</text>
<rect x="20" y="47.760000000000005" width="520" height="138.6" rx="14" fill="#3a3020" stroke="#e0c27a" stroke-width="2"/>
<text x="32" y="77.7" font-size="16" font-weight="650" fill="#f6e7b8" text-anchor="start">Human operator</text>
<text x="32" y="96.6" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">admin credential declaring sessionKind: "human". Keeps goals</text>
<text x="32" y="115.1" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">and priorities, money and accounts, and credentials for people.</text>
<text x="32" y="133.5" font-size="14" font-weight="400" fill="#f6e7b8" text-anchor="start">The master applies every other decision.</text>
<rect x="32" y="150.32" width="55.0" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="40" y="167.9" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">admin</text>
<rect x="95" y="150.32" width="156.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="103" y="167.9" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sessionKind: human</text>
<line x1="280" y1="186.32" x2="280" y2="230.32" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="290" y="214.3" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">human-only decisions</text>
<rect x="20" y="232.32" width="520" height="123.0" rx="4" fill="#182a36" stroke="#8fc1e6" stroke-width="2"/>
<text x="32" y="262.3" font-size="16" font-weight="650" fill="#d8ecf9" text-anchor="start">Graphyard control plane</text>
<text x="32" y="281.1" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">Server, Postgres, dashboard, and CLI. Records ownership (lease</text>
<text x="32" y="299.6" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">+ epoch), requirements, the candidate (change number, head SHA,</text>
<text x="32" y="318.1" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">base SHA), evidence, gate decisions. Gates are deterministic;</text>
<text x="32" y="336.6" font-size="14" font-weight="400" fill="#d8ecf9" text-anchor="start">there is no lifecycle-state endpoint and no merge bypass.</text>
<rect x="20" y="443.36" width="320" height="524.64" rx="14" fill="#2a2338" stroke="#c3b1ec" stroke-width="2"/>
<text x="32" y="467.36" font-size="16" font-weight="650" fill="#e9e0f9">Herdr runtime hosts the sessions</text>
<rect x="32" y="483.36" width="296" height="157.0" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="44" y="513.3" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Master (coordinator)</text>
<text x="44" y="532.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Durable loop plus an optional</text>
<text x="44" y="550.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">visible session. Dispatches ready</text>
<text x="44" y="569.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">work, shepherds review, records</text>
<text x="44" y="587.6" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">what the merge writer landed.</text>
<rect x="44" y="604.4" width="101.8" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="52" y="622.0" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">coordinator</text>
<rect x="32" y="650.4000000000001" width="296" height="138.6" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="44" y="680.4" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Slice lead</text>
<text x="44" y="699.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Rules on plans and failures inside</text>
<text x="44" y="717.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">one slice, citing a rule ID. Never</text>
<text x="44" y="736.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">implements or merges.</text>
<rect x="44" y="752.96" width="94.0" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="52" y="770.5" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">slice-lead</text>
<rect x="32" y="798.96" width="296" height="157.0" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="44" y="828.9" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Worker</text>
<text x="44" y="847.8" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Claims one item, edits only its</text>
<text x="44" y="866.3" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">assigned worktree, commits,</text>
<text x="44" y="884.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">submits the exact head. Pushes</text>
<text x="44" y="903.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">nothing. Stops on lease loss.</text>
<rect x="44" y="920" width="62.8" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="52" y="937.6" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worker</text>
<rect x="114.8" y="920" width="117.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="122.8" y="937.6" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lease · epoch</text>
<rect x="240.2" y="920" width="78.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="248.2" y="937.6" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worktree</text>
<rect x="352" y="443.36" width="188" height="175.5" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="364" y="473.3" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Reviewer</text>
<text x="364" y="492.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Launched by the</text>
<text x="364" y="510.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">control plane; posts</text>
<text x="364" y="529.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">its verdict on the</text>
<text x="364" y="547.6" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">exact head to the</text>
<text x="364" y="566.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">API.</text>
<rect x="364" y="582.88" width="78.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="372" y="600.5" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reviewer</text>
<rect x="352" y="628.88" width="188" height="175.5" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="364" y="658.8" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Proof producer</text>
<text x="364" y="677.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">CI workflow or</text>
<text x="364" y="696.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">trusted runner.</text>
<text x="364" y="714.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Submits evidence</text>
<text x="364" y="733.1" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">bound to head, base,</text>
<text x="364" y="751.6" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">and policy revision.</text>
<rect x="364" y="768.4" width="78.4" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="372" y="786.0" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">producer</text>
<rect x="450.4" y="768.4" width="55.0" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="458.4" y="786.0" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">grant</text>
<rect x="352" y="814.4" width="188" height="157.0" rx="14" fill="#22311f" stroke="#c5e69b" stroke-width="2"/>
<text x="364" y="844.4" font-size="16" font-weight="650" fill="#e1f3c8" text-anchor="start">Operator agent</text>
<text x="364" y="863.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Optional, scoped.</text>
<text x="364" y="881.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">Adds intent and</text>
<text x="364" y="900.2" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">requirements; never</text>
<text x="364" y="918.7" font-size="14" font-weight="400" fill="#e1f3c8" text-anchor="start">removes them.</text>
<rect x="364" y="935.4399999999999" width="125.2" height="24" rx="12" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="372" y="953.0" font-size="13" font-weight="400" fill="#c5e69b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">operator-agent</text>
<line x1="180" y1="439.36" x2="180" y2="359.36" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="170" y="379.6" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">claim, heartbeat, submit,</text>
<text x="170" y="396.8" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">dispatch, merge request:</text>
<text x="170" y="413.9" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">each under its own</text>
<text x="170" y="431.1" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">credential</text>
<line x1="446" y1="439.36" x2="446" y2="359.36" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="436" y="396.8" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">evidence,</text>
<text x="436" y="413.9" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="end">bounded intent</text>
<rect x="20" y="1027.44" width="520" height="104.6" rx="4" fill="#262d28" stroke="#b8c2bb" stroke-width="2"/>
<text x="32" y="1057.4" font-size="16" font-weight="650" fill="#e3e9e3" text-anchor="start">Git remote (e.g. GitHub)</text>
<text x="32" y="1076.3" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">Holds the base branch. Only the merge writer pushes to it, with</text>
<text x="32" y="1094.7" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">its deploy key; Graphyard reads no pull requests, reviews or</text>
<text x="32" y="1113.2" font-size="14" font-weight="400" fill="#e3e9e3" text-anchor="start">checks from it.</text>
<text x="20" y="1160.6" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">Graphyard and the remote: submitted heads live in Graphyard’s own</text>
<text x="20" y="1177.7" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">object store; the merge writer trial-merges a head whose gates passed,</text>
<text x="20" y="1194.9" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">runs its build and tests, and pushes the base branch. Herdr reports</text>
<text x="20" y="1212.1" font-size="13" font-weight="400" fill="#b8c6b7" text-anchor="start">whether a session is alive; it never decides ownership or progression.</text>
<text x="20" y="1250.8" font-size="18" font-weight="700" fill="#e6ede4" text-anchor="start">Legend (glossary terms)</text>
<g transform="translate(0 1262.4)"><rect x="20" y="0" width="34" height="22" rx="9" fill="#3a3020" stroke="#e0c27a" stroke-width="2"/></g>
<text x="66" y="1277.1" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Human operator (human authority)</text>
<g transform="translate(0 1292.4)"><rect x="20" y="0" width="34" height="22" rx="9" fill="#22311f" stroke="#c5e69b" stroke-width="2"/></g>
<text x="66" y="1307.1" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">AI agent session (one role, one credential)</text>
<g transform="translate(0 1322.4)"><rect x="20" y="0" width="34" height="22" rx="3" fill="#182a36" stroke="#8fc1e6" stroke-width="2"/></g>
<text x="66" y="1337.1" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Graphyard control plane</text>
<g transform="translate(0 1352.4)"><rect x="20" y="0" width="34" height="22" rx="9" fill="#2a2338" stroke="#c3b1ec" stroke-width="2"/></g>
<text x="66" y="1367.1" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Herdr runtime (session supervision)</text>
<g transform="translate(0 1382.4)"><rect x="20" y="0" width="34" height="22" rx="3" fill="#262d28" stroke="#b8c2bb" stroke-width="2"/></g>
<text x="66" y="1397.1" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Git remote and other external facts</text>
<g transform="translate(0 1412.4)"><rect x="20" y="0" width="34" height="22" rx="11" fill="#111714" stroke="#c5e69b" stroke-width="1.5" stroke-dasharray="3 3"/></g>
<text x="66" y="1427.1" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Chip: credential, lease epoch, or assigned worktree the</text>
<text x="66" y="1445.6" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">session holds</text>
<g transform="translate(0 1457.4)"><line x1="20" y1="11" x2="54" y2="11" stroke="#9fb39c" stroke-width="2.5" marker-end="url(#arrow)"/></g>
<text x="66" y="1472.1" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Solid arrow: an authenticated command or authority</text>
<g transform="translate(0 1487.4)"><line x1="20" y1="11" x2="54" y2="11" stroke="#9fb39c" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/></g>
<text x="66" y="1502.1" font-size="14" font-weight="400" fill="#e6ede4" text-anchor="start">Dashed arrow: observation or health report, never authority</text>
</svg>
