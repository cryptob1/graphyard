apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graphyard.fullname" . }}
  labels:
    {{- include "graphyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "graphyard.serverSelectorLabels" . | nindent 6 }}
  # Replicas share the Postgres ledger; coordination locks and job leases live there, so a
  # rolling update needs no sticky sessions and the additive schema serves both versions.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "graphyard.serverSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "graphyard.waitForPostgresql" . | nindent 6 }}
      containers:
        - name: graphyard
          image: {{ include "graphyard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # The image's `npm start` is `tsx src/server.ts`; invoking node directly keeps npm
          # from wanting a writable home on the read-only root filesystem.
          command: ["node", "--import", "tsx", "src/server.ts"]
          ports:
            - name: http
              containerPort: 4310
          env:
            {{- include "graphyard.env" . | nindent 12 }}
          envFrom:
            {{- include "graphyard.configEnvFrom" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "graphyard.secretMounts" . | nindent 12 }}
      volumes:
        {{- include "graphyard.secretVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
