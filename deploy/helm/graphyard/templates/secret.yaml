{{- if .Values.secrets.create }}
# Evaluation only. Production installations reference an existing Secret managed outside Helm values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graphyard.fullname" . }}
  labels:
    {{- include "graphyard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.username .Values.postgresql.password (include "graphyard.postgresqlName" .) .Values.postgresql.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  GRAPHYARD_PRINCIPALS: {{ .Values.secrets.principals | quote }}
  GITHUB_PRIVATE_KEY: {{ .Values.secrets.githubPrivateKey | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
{{- end }}
