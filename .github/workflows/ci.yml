name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to a pull request supersedes the run for its older head, which is cancelled rather
  # than left holding a runner. Every other run (pushes to main, merge-queue refs) gets a group of
  # its own, so none of them is ever cancelled, running or pending.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The pre-merge gate runs only fast, deterministic checks (GY-1093): typecheck and the test
  # aggregate below are the required set, every job of it bounded so the set finishes in under ten
  # minutes. The soak, the timing-budget suites, container acceptance, container recovery and the
  # chart run only against a release-candidate SHA, in release-candidate.yml.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan full Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          # HEAD, not --all: a pull request is scanned over its own history (the base branch plus its
          # commits), so one branch's finding can never fail another branch's check (GY-435).
          ./gitleaks git --redact --log-opts=HEAD --gitleaks-ignore-path "$GITHUB_WORKSPACE/.github/gitleaksignore.txt" "$GITHUB_WORKSPACE"
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Lint every workflow with actionlint
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run docs:check
  # The Node suite's pre-merge files, split over a matrix of shard jobs (GY-499). Each shard runs
  # the files scripts/ci-tests.mjs assigns it, balanced by the per-file durations recorded in
  # tests/helpers/timing-baseline.json; the shard count is this matrix's length (default 4). On a
  # pull request's own run only the test files its change affects are selected; pushes to main,
  # merge-queue tips and any change the dependency map cannot place run every pre-merge file.
  test-shard:
    name: test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        # Two commits: a pull request's checkout is its merge onto the base, whose first parent is
        # the base, so the change is the diff between them.
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # The coordinator-confinement suite builds launches and runs shell probes inside real
      # bubblewrap namespaces (GY-888), and a host without bubblewrap must refuse every session
      # rather than start one unconfined. Ubuntu 24.04 confines unprivileged user namespaces to
      # profiled binaries, so the runner lifts that restriction for the suite.
      # A stalled apt mirror once held two shards in this step until the job timeout cancelled them
      # (GY-1468), and three 50-second attempts outran this step's three-minute bound twice on
      # 2026-10-07, failing main (GY-1483). Each apt call is bounded at 25 seconds and the second and
      # third attempts switch to another Ubuntu mirror, so the attempts fit inside the bound.
      - name: Install bubblewrap (the confinement suite runs real namespaces)
        id: bubblewrap
        timeout-minutes: 3
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          apt=(-q -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          mirrors=('' http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/)
          installed=false
          command -v bwrap >/dev/null && installed=true
          for attempt in 1 2 3; do
            [[ $installed == true ]] && break
            mirror=${mirrors[attempt - 1]}
            if [[ -n $mirror ]]; then
              echo "::warning::bubblewrap install attempt $attempt uses the fallback mirror $mirror"
              sudo sed -i -E "s#^URIs: .*#URIs: $mirror#" /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null
              sudo sed -i -E "s#^(deb(-src)? (\[[^]]*\] )?)[^ ]+#\1$mirror#" /etc/apt/sources.list 2>/dev/null
            fi
            if sudo timeout 25 apt-get update "${apt[@]}" && sudo timeout 25 apt-get install -y "${apt[@]}" bubblewrap; then installed=true; break; fi
            sleep 3
          done
          [[ $installed == true ]] || exit 1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
      # An install that failed every attempt, or hit its step bound, is an infrastructure failure,
      # not a test failure. A failed step fails the job, which the main guard judges a failing test
      # and reverts; so this step instead outwaits the job's own timeout, the shard concludes timed
      # out, and the guard treats the run like a cancelled one: it reruns it and never reverts.
      - name: Hold an exhausted bubblewrap install to the job timeout (an infrastructure failure)
        if: steps.bubblewrap.outcome == 'failure'
        run: |
          echo "::error title=Infrastructure failure, not a test failure::bubblewrap could not be installed from any mirror; this shard waits for the job timeout so it concludes timed out (cancelled), which the main guard reruns and never reverts"
          sleep 600
          exit 1
      # Docker Hub refuses anonymous pulls from shared runner addresses past its rate limit (GY-1607):
      # the daemon pulls Docker Hub images through the mirror.gcr.io registry mirror, falling back to
      # Docker Hub for an image the mirror lacks. Verified with docker info before any docker command,
      # and the pull of this job's Docker Hub images is logged through the mirror.
      - name: Pull Docker Hub images through the registry mirror
        shell: bash
        env:
          DOCKER_HUB_IMAGES: alpine:3
        run: |
          set -euo pipefail
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"], "debug": true}' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          since="$(date '+%Y-%m-%d %H:%M:%S')"
          sudo systemctl restart docker
          mirrors="$(docker info --format '{{json .RegistryConfig.Mirrors}}')"
          echo "Docker daemon registry mirrors: $mirrors"
          [[ $mirrors == *'https://mirror.gcr.io'* ]] || { echo '::error::the Docker daemon is not using the registry mirror' >&2; exit 1; }
          for image in $DOCKER_HUB_IMAGES; do docker pull --quiet "$image"; done
          sudo journalctl --unit docker --since "$since" --no-pager | grep -F 'mirror.gcr.io' || echo '::warning::the daemon log names no pull through mirror.gcr.io'
      - name: Select the test files this run executes
        run: node scripts/ci-tests.mjs select --out "$RUNNER_TEMP/selected-tests.txt"
      - name: Run this shard, keeping the record of its timing-dependent assertions
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          set -euo pipefail
          echo "GRAPHYARD_TIMING_RECORD=$RUNNER_TEMP/timing/shard-${{ matrix.shard }}.jsonl" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/timing"
          # Test files run in parallel, each with its own Postgres on a per-file port offset. Two
          # files share offset 25; this gives one of them a free port so neither fails on scheduling.
          GRAPHYARD_TIMING_SLACK=1.5 GRAPHYARD_EVENTS_TEST_PORT=15466 GRAPHYARD_TIMING_RECORD="$RUNNER_TEMP/timing/shard-${{ matrix.shard }}.jsonl" npm test -- --shard "$SHARD" --files-from "$RUNNER_TEMP/selected-tests.txt" --durations "$RUNNER_TEMP/timing/durations-${{ matrix.shard }}.jsonl" 2>&1 | tee "$RUNNER_TEMP/timing/test-${{ matrix.shard }}.log"
      - name: Summarise this shard's timing-dependent assertions
        if: always()
        run: npx tsx tests/helpers/timing-report.ts "$GRAPHYARD_TIMING_RECORD" > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphyard-timing-record-${{ matrix.shard }}
          path: ${{ runner.temp }}/timing/
          if-no-files-found: ignore
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  # The required check. Branch protection names `test`, so this job keeps the name and passes only
  # when every shard and the browser suite passed; a failed, skipped or cancelled one fails it.
  test:
    needs: [test-shard, test-browser]
    # Not always(): a run cancelled for a superseded head reports nothing rather than a failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: graphyard-timing-record-*
          path: ${{ runner.temp }}/timing
          merge-multiple: true
      - name: Find timing-dependent assertions over budget
        id: timing
        shell: bash
        run: |
          shopt -s nullglob
          records=("$RUNNER_TEMP"/timing/shard-*.jsonl)
          if (( ${#records[@]} )); then cat "${records[@]}" > "$RUNNER_TEMP/graphyard-timing.jsonl"; fi
          if grep -qs '"passed":false' "$RUNNER_TEMP/graphyard-timing.jsonl"; then echo "over=true" >> "$GITHUB_OUTPUT"; fi
      # Report when an assertion went over its budget or a shard failed: the failed-tests annotation
      # is what the base-breakage judgement reads (GY-793), on pull requests and on pushes to main
      # alike. A passing run within budget pays for no install here.
      - name: Decide whether to report on this check run
        id: report
        if: steps.timing.outputs.over == 'true' || needs.test-shard.result == 'failure'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.report.outputs.run == 'true'
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        if: steps.report.outputs.run == 'true'
        with: { node-version: '24', cache: npm }
      - name: Report timing-dependent assertions on this check run
        # Whatever the suite's verdict, and never changing it: an assertion that went over its
        # budget is annotated on the required check with what it measured, which
        # `graphyard master status` reads back, beside how many tests failed across every shard;
        # every failed test is named in one `graphyard-failed-tests:` annotation.
        if: steps.report.outputs.run == 'true'
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx tsx tests/helpers/timing-report.ts "$RUNNER_TEMP/graphyard-timing.jsonl" "$RUNNER_TEMP"/timing/test-*.log
      - name: Pass only when every shard and the browser suite passed
        env:
          SHARDS: ${{ needs.test-shard.result }}
          BROWSER: ${{ needs.test-browser.result }}
        run: |
          echo "shards: $SHARDS, browser: $BROWSER"
          test "$SHARDS" = success && test "$BROWSER" = success
