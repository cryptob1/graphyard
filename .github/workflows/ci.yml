name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to a pull request supersedes the run for its older head, which is cancelled rather
  # than left holding a runner. Every other run (pushes to main, merge-queue refs) gets a group of
  # its own, so none of them is ever cancelled, running or pending.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  container-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Build candidate image as the release process would
        run: |
          version="$(node -p "require('./package.json').version")"
          docker build --build-arg "GRAPHYARD_VERSION=$version" --build-arg "GRAPHYARD_BUILD_REVISION=$GITHUB_SHA" --tag graphyard-ci .
      - name: Exercise container over HTTP with an isolated database
        # Validation only: this PR-controlled job has no evidence-producer credential.
        run: |
          echo '{}' > "$RUNNER_TEMP/candidate.json"
          node scripts/run-acceptance.mjs "$RUNNER_TEMP/candidate.json" graphyard-ci "$RUNNER_TEMP/acceptance.json"
      - name: Exercise the merge-authorization contract against the container
        # Validation only: this PR-controlled job has no evidence-producer credential.
        run: node scripts/run-acceptance.mjs "$RUNNER_TEMP/candidate.json" graphyard-ci "$RUNNER_TEMP/merge-authorization.json" integration:merge-authorization
      - name: Verify the release contract, backup and restore with the shipped image
        run: node scripts/verify-image-release.mjs graphyard-ci "$(node -p "require('./package.json').version")" "$GITHUB_SHA"
  container-recovery:
    runs-on: ubuntu-latest
    # The recovery contract waits out the shipped two-minute lease and launch fences.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Build candidate image
        run: docker build --tag graphyard-ci .
      - name: Recover an expired lease on a second machine identity
        # Validation only: this PR-controlled job has no evidence-producer credential.
        run: |
          echo '{}' > "$RUNNER_TEMP/candidate.json"
          node scripts/run-acceptance.mjs "$RUNNER_TEMP/candidate.json" graphyard-ci "$RUNNER_TEMP/recovery.json" integration:herdr-recovery
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          # The scan reads one branch's history, never every fetched branch, so one branch's finding
          # cannot fail another branch's check: a pull request scans its own history (the base
          # branch's full history plus base..HEAD), a push scans the pushed branch. Test fixtures
          # that look like credentials are written as obvious non-secrets, or their fingerprint is
          # recorded in .github/gitleaksignore.txt (test files only).
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="origin/${{ github.base_ref }}"
            "$RUNNER_TEMP/gitleaks" git --redact --gitleaks-ignore-path .github/gitleaksignore.txt --log-opts="$base" "$GITHUB_WORKSPACE"
            "$RUNNER_TEMP/gitleaks" git --redact --gitleaks-ignore-path .github/gitleaksignore.txt --log-opts="$base..HEAD" "$GITHUB_WORKSPACE"
          else
            "$RUNNER_TEMP/gitleaks" git --redact --gitleaks-ignore-path .github/gitleaksignore.txt --log-opts="origin/${{ github.ref_name }}" "$GITHUB_WORKSPACE"
          fi
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Lint every workflow with actionlint
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run docs:check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Run the suite, keeping the record of its timing-dependent assertions
        shell: bash
        run: |
          set -euo pipefail
          echo "GRAPHYARD_TIMING_RECORD=$RUNNER_TEMP/graphyard-timing.jsonl" >> "$GITHUB_ENV"
          # Test files run in parallel, each with its own Postgres on a per-file port offset. Two
          # files share offset 25; this gives one of them a free port so neither fails on scheduling.
          GRAPHYARD_EVENTS_TEST_PORT=15466 GRAPHYARD_TIMING_RECORD="$RUNNER_TEMP/graphyard-timing.jsonl" npm test 2>&1 | tee "$RUNNER_TEMP/graphyard-test.log"
      - name: Report timing-dependent assertions on this check run
        # Whatever the suite's verdict, and never changing it: an assertion that went over its
        # budget is annotated with what it measured, which `graphyard master status` reads back.
        if: always()
        run: npx tsx tests/helpers/timing-report.ts "$GRAPHYARD_TIMING_RECORD" "$RUNNER_TEMP/graphyard-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphyard-timing-record
          path: ${{ runner.temp }}/graphyard-timing.jsonl
          if-no-files-found: ignore
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
