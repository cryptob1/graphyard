name: Release candidate
# One moving main, a frozen candidate, UAT, then that exact SHA in production (docs/delivery.md).
# A cut tags main's tip (rc/ID) and nothing else, so merges keep flowing while the candidate is under
# test. The long suites the pre-merge gate never runs (GY-1093) — container acceptance, container
# recovery and the chart here, the advisory soak and timing-budget suites in release-candidate-soak.yml,
# which this run dispatches (GY-1513) — run against the candidate's exact SHA, never on a pull request
# and never as a required check; then Railway's uat environment serves that
# SHA and the suites that drive the deployment run against it. Railway's uat and production track
# release/uat and release/production, never main; `graphyard release` moves them to the exact SHA.
# A dispatched `sha`, or a pushed rc tag (rc-*), validates that one commit with the long suites alone:
# it is not a recorded candidate, so it is never deployed or promoted.
# The master loop dispatches the next cut as soon as the last concludes and main has moved (GY-1488);
# the six-hourly cron is only a fallback for a loop that is down.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to validate alone; leave empty to cut main's tip as a candidate
        required: false
        default: ''
      promote:
        description: Promote the cut candidate to production when its UAT validation passes
        type: boolean
        default: true
  push:
    tags: ['rc-*']
permissions:
  contents: read
concurrency:
  # One cut candidate at a time, and one validation per pinned SHA; a second request waits rather than cancels.
  group: ${{ github.workflow }}-${{ inputs.sha || (github.event_name == 'push' && github.sha) || 'cut' }}
  cancel-in-progress: false
jobs:
  candidate:
    name: cut or pin the candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      id: ${{ steps.pin.outputs.id }}
      sha: ${{ steps.pin.outputs.sha }}
    env:
      PINNED: ${{ inputs.sha || (github.event_name == 'push' && github.sha) || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Cut a release candidate from main's tip, or pin the dispatched SHA or tagged commit
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PINNED" ]]; then
            [[ "$PINNED" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit SHA: $PINNED" >&2; exit 1; }
            echo "sha=$PINNED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "candidates are cut only by the workflow on main, not $GITHUB_REF" >&2; exit 1; }
          # The pre-cut check (docs/validation.md#release-contract): a broken binding in e2e/contract.json
          # fails the cut, naming each outcome and case, before any rc/ tag is written.
          node bin/graphyard.mjs release contract
          node bin/graphyard.mjs release cut --trigger "${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}" | tee cut.json
          echo "id=$(node -p "const r=require('./cut.json'); r.cut ? r.candidate.id : ''")" >> "$GITHUB_OUTPUT"
          echo "sha=$(node -p "const r=require('./cut.json'); r.cut ? r.candidate.sha : ''")" >> "$GITHUB_OUTPUT"
  soak:
    name: start the advisory soak
    needs: candidate
    if: needs.candidate.outputs.sha != ''
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    # The soak and timing-budget suites run in release-candidate-soak.yml, a run of their own for this
    # exact SHA (GY-1513): they are advisory (GY-1440), so this run concludes when promote does rather
    # than ~17 minutes later, and the loop cuts the next candidate while this one's soak still runs.
    steps:
      - name: Dispatch the soak and timing-budget suites for the candidate SHA
        run: gh workflow run release-candidate-soak.yml --repo "$GITHUB_REPOSITORY" --ref main -f sha="$CANDIDATE_SHA" -f candidate="${{ needs.candidate.outputs.id }}"
        env:
          GH_TOKEN: ${{ github.token }}
  container-acceptance:
    needs: candidate
    if: needs.candidate.outputs.sha != ''
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.CANDIDATE_SHA }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # Docker Hub refuses anonymous pulls from shared runner addresses past its rate limit (GY-1607):
      # the daemon is given the mirror.gcr.io registry mirror (verified with docker info before any
      # docker command), and this job's Docker Hub images are pulled by their mirror.gcr.io name and
      # tagged with their Docker Hub name, so no step contacts Docker Hub for them. The step fails when
      # the mirror cannot serve an image, or when the tagged image does not resolve to the mirror.
      - name: Pull Docker Hub images through the registry mirror
        shell: bash
        env:
          DOCKER_HUB_IMAGES: node:24-bookworm-slim postgres:17-alpine
        run: |
          set -euo pipefail
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          mirrors="$(docker info --format '{{json .RegistryConfig.Mirrors}}')"
          echo "Docker daemon registry mirrors: $mirrors"
          [[ $mirrors == *'https://mirror.gcr.io'* ]] || { echo '::error::the Docker daemon is not using the registry mirror' >&2; exit 1; }
          for image in $DOCKER_HUB_IMAGES; do
            docker pull --quiet "mirror.gcr.io/library/$image"
            docker tag "mirror.gcr.io/library/$image" "$image"
            digests="$(docker image inspect --format '{{json .RepoDigests}}' "$image")"
            echo "$image resolved through the registry mirror: $digests"
            [[ $digests == *'mirror.gcr.io/library/'* ]] || { echo "::error::$image does not resolve to the registry mirror" >&2; exit 1; }
          done
      - name: Build candidate image as the release process would
        run: |
          version="$(node -p "require('./package.json').version")"
          docker build --build-arg "GRAPHYARD_VERSION=$version" --build-arg "GRAPHYARD_BUILD_REVISION=$CANDIDATE_SHA" --tag graphyard-ci .
      - name: Exercise container over HTTP with an isolated database
        # Validation only: this job has no evidence-producer credential.
        run: |
          echo '{}' > "$RUNNER_TEMP/candidate.json"
          node scripts/run-acceptance.mjs "$RUNNER_TEMP/candidate.json" graphyard-ci "$RUNNER_TEMP/acceptance.json"
      - name: Verify the release contract, backup and restore with the shipped image
        run: node scripts/verify-image-release.mjs graphyard-ci "$(node -p "require('./package.json').version")" "$CANDIDATE_SHA"
  container-recovery:
    needs: candidate
    if: needs.candidate.outputs.sha != ''
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
    runs-on: ubuntu-latest
    # The recovery contract waits out the shipped two-minute lease and launch fences.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.CANDIDATE_SHA }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # Docker Hub refuses anonymous pulls from shared runner addresses past its rate limit (GY-1607):
      # the daemon is given the mirror.gcr.io registry mirror (verified with docker info before any
      # docker command), and this job's Docker Hub images are pulled by their mirror.gcr.io name and
      # tagged with their Docker Hub name, so no step contacts Docker Hub for them. The step fails when
      # the mirror cannot serve an image, or when the tagged image does not resolve to the mirror.
      - name: Pull Docker Hub images through the registry mirror
        shell: bash
        env:
          DOCKER_HUB_IMAGES: node:24-bookworm-slim postgres:17-alpine
        run: |
          set -euo pipefail
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          mirrors="$(docker info --format '{{json .RegistryConfig.Mirrors}}')"
          echo "Docker daemon registry mirrors: $mirrors"
          [[ $mirrors == *'https://mirror.gcr.io'* ]] || { echo '::error::the Docker daemon is not using the registry mirror' >&2; exit 1; }
          for image in $DOCKER_HUB_IMAGES; do
            docker pull --quiet "mirror.gcr.io/library/$image"
            docker tag "mirror.gcr.io/library/$image" "$image"
            digests="$(docker image inspect --format '{{json .RepoDigests}}' "$image")"
            echo "$image resolved through the registry mirror: $digests"
            [[ $digests == *'mirror.gcr.io/library/'* ]] || { echo "::error::$image does not resolve to the registry mirror" >&2; exit 1; }
          done
      - name: Build candidate image
        run: docker build --tag graphyard-ci .
      - name: Recover an expired lease on a second machine identity
        # Validation only: this job has no evidence-producer credential.
        run: |
          echo '{}' > "$RUNNER_TEMP/candidate.json"
          node scripts/run-acceptance.mjs "$RUNNER_TEMP/candidate.json" graphyard-ci "$RUNNER_TEMP/recovery.json" integration:herdr-recovery
  chart:
    needs: candidate
    if: needs.candidate.outputs.sha != ''
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.CANDIDATE_SHA }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Lint and render the chart
        run: |
          set -euo pipefail
          helm lint deploy/helm/graphyard --strict --set secrets.existingSecret=graphyard-credentials
          helm template graphyard deploy/helm/graphyard --set secrets.existingSecret=graphyard-credentials > /dev/null
          # An installation with nowhere to hold credentials must not render.
          if helm template graphyard deploy/helm/graphyard > /dev/null 2>&1; then echo 'chart rendered without credentials' >&2; exit 1; fi
      # Docker Hub refuses anonymous pulls from shared runner addresses past its rate limit (GY-1607):
      # the daemon is given the mirror.gcr.io registry mirror (verified with docker info before any
      # docker command), and this job's Docker Hub images are pulled by their mirror.gcr.io name and
      # tagged with their Docker Hub name, so no step contacts Docker Hub for them. The step fails when
      # the mirror cannot serve an image, or when the tagged image does not resolve to the mirror.
      - name: Pull Docker Hub images through the registry mirror
        shell: bash
        env:
          DOCKER_HUB_IMAGES: node:24-bookworm-slim
        run: |
          set -euo pipefail
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          mirrors="$(docker info --format '{{json .RegistryConfig.Mirrors}}')"
          echo "Docker daemon registry mirrors: $mirrors"
          [[ $mirrors == *'https://mirror.gcr.io'* ]] || { echo '::error::the Docker daemon is not using the registry mirror' >&2; exit 1; }
          for image in $DOCKER_HUB_IMAGES; do
            docker pull --quiet "mirror.gcr.io/library/$image"
            docker tag "mirror.gcr.io/library/$image" "$image"
            digests="$(docker image inspect --format '{{json .RepoDigests}}' "$image")"
            echo "$image resolved through the registry mirror: $digests"
            [[ $digests == *'mirror.gcr.io/library/'* ]] || { echo "::error::$image does not resolve to the registry mirror" >&2; exit 1; }
          done
      - name: Build the candidate image
        run: |
          version="$(node -p "require('./package.json').version")"
          docker build --build-arg "GRAPHYARD_VERSION=$version" --build-arg "GRAPHYARD_BUILD_REVISION=$CANDIDATE_SHA" --tag "graphyard:$version" .
          docker tag "graphyard:$version" "graphyard:$version-next"
      - uses: helm/kind-action@v1
        with: { cluster_name: graphyard }
      # The cluster's containerd pulls the chart's Docker Hub images (the bundled postgres:17-alpine)
      # itself, so each node resolves docker.io through mirror.gcr.io alone, with no Docker Hub fallback.
      - name: Pull the cluster's Docker Hub images through the registry mirror
        shell: bash
        run: |
          set -euo pipefail
          for node in $(kind get nodes --name graphyard); do
            docker exec "$node" mkdir -p /etc/containerd/certs.d/docker.io
            printf '%s\n' 'server = "https://mirror.gcr.io"' '[host."https://mirror.gcr.io"]' '  capabilities = ["pull", "resolve"]' | docker exec -i "$node" tee /etc/containerd/certs.d/docker.io/hosts.toml
            docker exec "$node" grep -q 'config_path *= *"/etc/containerd/certs.d"' /etc/containerd/config.toml || { echo "::error::kind node $node does not read /etc/containerd/certs.d" >&2; exit 1; }
          done
      - name: Install, exercise, upgrade and restore on a real cluster
        run: bash deploy/helm/exercise.sh "graphyard:$(node -p "require('./package.json').version")"
  uat:
    needs: [candidate, container-acceptance, container-recovery, chart]
    # Runs once the container and chart jobs finish, passed or not, so their verdicts join the
    # candidate's UAT record. The soak and timing-budget suites are advisory: they run in their own
    # workflow beside UAT and report on that run, but neither delay nor decide promotion (docs/delivery.md).
    if: ${{ !cancelled() && needs.candidate.outputs.id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    # The uat environment holds the UAT URL, the token of a principal in UAT's own control plane that
    # the api suite drives it with, and the credential that files a failed candidate's follow-up item;
    # it holds nothing that can write to the production repository.
    environment: uat
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
    steps:
      # The CLI runs the candidate's own code, checked out at its exact SHA.
      - uses: actions/checkout@v4
        with: { ref: '${{ env.CANDIDATE_SHA }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Deploy the candidate's exact SHA to UAT
        # Refused while UAT serves another candidate whose validation has no verdict yet, and leased
        # on the tip it observed, so a manual `release uat` never moves UAT under a running validation.
        run: node bin/graphyard.mjs release uat "${{ needs.candidate.outputs.id }}"
      - name: Run the suites against the UAT deployment and record the verdict
        # UAT must keep serving the candidate SHA, which is checked again after the last suite:
        # `endpoints` probes /healthz?strict and /, `api` creates, replays and lists a work item and
        # reads the board and status through UAT's own API, and `browser` loads the dashboard UAT
        # serves in Chromium, signs in with the UAT token and opens the Work view, and `e2e` runs every
        # repository case under e2e/cases/ targeted at uat (docs/validation.md), writing its report for
        # the next step. Those four exercise
        # the UAT deployment itself; the container and chart suites ran on runners at the candidate SHA, so each
        # of those jobs' results above joins the record as a suite of its own. `zero-touch` (GY-1481)
        # runs the zero-touch onboarding scenario on this checkout of the candidate's SHA: `graphyard up
        # --agent --goal FILE` on a throwaway repository against an in-process GitHub must reach a merged
        # first planned item with no human step but GitHub's one App approval, so a change that adds a
        # human step to onboarding fails the candidate and blocks its promotion. A failing or flaky
        # required case files one release hold per failed outcome of e2e/contract.json, read from
        # that report; any other failure files one follow-up item naming the failing suite and the
        # candidate SHA; only that filing uses GRAPHYARD_TOKEN, which no --suite command is given.
        run: |
          # The suite commands expand their variables when the suite runs, not here.
          # shellcheck disable=SC2016
          node bin/graphyard.mjs release validate "${{ needs.candidate.outputs.id }}" --url "$UAT_URL" --wait 1200 --api \
            --suite 'browser=node --import tsx --eval "import(\"./src/release-candidate.ts\").then(m => m.runBrowserSuite())"' \
            --suite 'e2e=node --import tsx --eval "import(\"./src/e2e/runner.ts\").then(m => m.runE2eSuite())"' \
            --suite 'container-acceptance=test "$CONTAINER_ACCEPTANCE" = success' \
            --suite 'container-recovery=test "$CONTAINER_RECOVERY" = success' \
            --suite 'chart=test "$CHART" = success' \
            --suite 'zero-touch=node --import tsx --eval "import(\"./src/release-candidate.ts\").then(m => m.runZeroTouchSuite())"'
        env:
          CONTAINER_ACCEPTANCE: ${{ needs.container-acceptance.result }}
          CONTAINER_RECOVERY: ${{ needs.container-recovery.result }}
          CHART: ${{ needs.chart.result }}
          UAT_URL: ${{ vars.UAT_URL }}
          GRAPHYARD_UAT_TOKEN: ${{ secrets.GRAPHYARD_UAT_TOKEN }}
          GRAPHYARD_E2E_REPORT: ${{ runner.temp }}/e2e-report.json
          GRAPHYARD_CANDIDATE_ID: ${{ needs.candidate.outputs.id }}
          GRAPHYARD_URL: ${{ vars.GRAPHYARD_URL }}
          GRAPHYARD_TOKEN: ${{ secrets.GRAPHYARD_RELEASE_TOKEN }}
      - name: Record the E2E case runs on the control plane's Tests page
        # Best effort and after the verdict: recording never decides promotion. The suite command
        # never holds the release credential, so this step records the report it wrote.
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/e2e-report.json" ]]; then node bin/graphyard.mjs e2e record "$RUNNER_TEMP/e2e-report.json"; else echo 'The e2e suite wrote no report; nothing to record'; fi
        env:
          GRAPHYARD_URL: ${{ vars.GRAPHYARD_URL }}
          GRAPHYARD_TOKEN: ${{ secrets.GRAPHYARD_RELEASE_TOKEN }}
  promote:
    needs: [candidate, uat]
    if: needs.uat.result == 'success' && (github.event_name == 'schedule' || inputs.promote)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Promote the UAT-passed candidate to production by its exact SHA
        run: node bin/graphyard.mjs release promote "${{ needs.candidate.outputs.id }}"
      - name: Confirm production serves the promoted SHA
        run: node bin/graphyard.mjs release verify --url "$PRODUCTION_URL" --wait 1200
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
