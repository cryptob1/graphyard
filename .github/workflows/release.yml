name: Release image
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Resolve the release version from the tag and package.json
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$declared" ]; then echo "Tag v$tag does not match package.json version $declared" >&2; exit 1; fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Docker Hub refuses anonymous pulls from shared runner addresses past its rate limit (GY-1607):
      # the daemon is given the mirror.gcr.io registry mirror (verified with docker info before any
      # docker command), and this job's Docker Hub images are pulled by their mirror.gcr.io name and
      # tagged with their Docker Hub name, so no step contacts Docker Hub for them. The step fails when
      # the mirror cannot serve an image, or when the tagged image does not resolve to the mirror.
      - name: Pull Docker Hub images through the registry mirror
        shell: bash
        env:
          DOCKER_HUB_IMAGES: node:24-bookworm-slim postgres:17-alpine
        run: |
          set -euo pipefail
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          mirrors="$(docker info --format '{{json .RegistryConfig.Mirrors}}')"
          echo "Docker daemon registry mirrors: $mirrors"
          [[ $mirrors == *'https://mirror.gcr.io'* ]] || { echo '::error::the Docker daemon is not using the registry mirror' >&2; exit 1; }
          for image in $DOCKER_HUB_IMAGES; do
            docker pull --quiet "mirror.gcr.io/library/$image"
            docker tag "mirror.gcr.io/library/$image" "$image"
            digests="$(docker image inspect --format '{{json .RepoDigests}}' "$image")"
            echo "$image resolved through the registry mirror: $digests"
            [[ $digests == *'mirror.gcr.io/library/'* ]] || { echo "::error::$image does not resolve to the registry mirror" >&2; exit 1; }
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, verify and publish the versioned control-plane image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ steps.version.outputs.repository }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg "GRAPHYARD_VERSION=$VERSION" \
            --build-arg "GRAPHYARD_BUILD_REVISION=$GITHUB_SHA" \
            --tag "$REPOSITORY:$VERSION" .
          # The image must report the release it claims before it is published anywhere.
          node scripts/verify-image-release.mjs "$REPOSITORY:$VERSION" "$VERSION" "$GITHUB_SHA"
          docker push "$REPOSITORY:$VERSION"
          docker image inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY:$VERSION" | tee image-digest.txt
      - uses: actions/upload-artifact@v4
        with: { name: image-digest, path: image-digest.txt, retention-days: 90 }
