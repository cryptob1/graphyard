name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
  packages: write
# Serialize latest/verified tags without cancelling a release in progress.
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - run: node scripts/build-publisher.mjs
      - name: Publish npm with provenance and push server and trial images
        run: node scripts/publish-verified.mjs --provenance
        env:
          GRAPHYARD_PUBLISH_COMMIT: ${{ github.sha }}
          GRAPHYARD_IMAGE_REGISTRY: ghcr.io/cryptob1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
