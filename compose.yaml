# Local evaluation and small self-hosted installations. See docs/deployment.md.
#
# The server runs the latest promoted release (the `stable` image tag) by default; `--build`
# builds the same image from this checkout instead. Set GRAPHYARD_IMAGE to pin a dated release
# or a digest:
#   GRAPHYARD_IMAGE=ghcr.io/cryptob1/graphyard:2026.10.17 docker compose --profile full up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: graphyard
      POSTGRES_PASSWORD: graphyard
      POSTGRES_DB: graphyard
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["graphyard-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphyard"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    image: ${GRAPHYARD_IMAGE:-ghcr.io/cryptob1/graphyard:stable}
    build:
      context: .
      args:
        GRAPHYARD_VERSION: ${GRAPHYARD_VERSION:-}
        GRAPHYARD_BUILD_REVISION: ${GRAPHYARD_BUILD_REVISION:-unknown}
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://graphyard:graphyard@db:5432/graphyard
      HOST: 0.0.0.0
    ports: ["127.0.0.1:4310:4310"]
    # Logical backups written by `docker compose exec server node bin/graphyard.mjs db backup /backups/NAME.json`.
    volumes: ["graphyard-backups:/backups"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  graphyard-data:
  graphyard-backups:
